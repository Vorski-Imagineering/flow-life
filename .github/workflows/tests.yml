name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
        env:
          # The words tests/test_no_personal_data.py looks for. A secret, because the
          # list is personal itself; not given to pull requests from forks, so it skips there.
          FLOW_LIFE_PERSONAL_WORDS: ${{ secrets.FLOW_LIFE_PERSONAL_WORDS }}
